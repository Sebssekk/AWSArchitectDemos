<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It Works</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e90ff 0%, #00c6a7 100%);
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 40px 60px;
            text-align: center;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 0.5em;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.3rem;
            margin-bottom: 1.5em;
        }
        .aws-logo {
            width: 80px;
            margin-bottom: 1em;
        }
        .btn {
            background: #ff9900;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: background 0.2s;
        }
        .btn:hover {
            background: #e68a00;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="aws-logo" src="https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png" alt="AWS Logo">
        <h1>Welcome to the AWS ECS Demo!</h1>
        <p>
            This demo showcases the power of <strong>Amazon Elastic Container Service (ECS)</strong>.<br>
            Deploy, manage, and scale your containerized applications with ease.
        </p>
        <button class="btn" onclick="alert('Enjoy the demo! 🚀')">Get Started</button>
    </div>
</body>
</html>
